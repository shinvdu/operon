# operon 端到端骨架基础设施
#
# 对应文章第三篇的核心架构：
# - 单 Lambda（Web Adapter 跑 axum）承载所有 HTTP 路由
# - Function URL（AWS_IAM 认证）替代 API Gateway —— 每百万请求省 $1
# - CloudFront + OAC 前置：只有经 CloudFront SigV4 签名的请求才能到达 Lambda
# - DynamoDB 按需计费表（dev/prod 环境隔离）
# - JWT 密钥在 SSM（SecureString），由 deploy.sh 预置，运行时冷启动批量拉取
#
# 与文章方案的差异：文章用 Pulumi(TypeScript) npm 包抽象；这里为测试骨架
# 用 CloudFormation 声明式模板，等价且无需额外工具链。

AWSTemplateFormatVersion: "2010-09-09"
Description: operon end-to-end skeleton (Lambda + Function URL + DynamoDB + SSM + CloudFront OAC)

Parameters:
  Project:
    Type: String
    Default: operon
  Environment:
    Type: String
    Default: dev
  LambdaArchitecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
  LambdaMemoryMB:
    Type: Number
    Default: 256
  CodeBucket:
    Type: String
    Description: S3 bucket holding the packaged bootstrap.zip
  CodeKey:
    Type: String
    Description: S3 key of the packaged bootstrap.zip
  WebAdapterLayerArn:
    Type: String
    Description: AWS Lambda Web Adapter layer ARN for this region/arch
    Default: "arn:aws:lambda:us-west-2:753240598075:layer:LambdaAdapterLayerX86:28"

Conditions:
  IsArm64: !Equals [!Ref LambdaArchitecture, arm64]

Resources:
  # ---------- DynamoDB（按需计费，单表） ----------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Project}-${Environment}-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------- IAM ----------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: operon-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !Sub "${UsersTable.Arn}/*"
              - Sid: SSMSecrets
                Effect: Allow
                Action:
                  - ssm:GetParametersByPath
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/${Environment}/*"
              - Sid: SSMDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

  # ---------- Lambda（单函数打天下，Web Adapter 承载 axum） ----------
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-api"
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - !Ref LambdaArchitecture
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 30
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Layers:
        - !Ref WebAdapterLayerArn
      Environment:
        Variables:
          OPERON_PROJECT: !Ref Project
          OPERON_ENV: !Ref Environment
          OPERON_SECRETS_PATH: !Sub "/${Project}/${Environment}/"
          OPERON_TABLE_PREFIX: !Sub "${Project}-${Environment}-"
          RUST_LOG: "info,aws_config=warn,aws_smithy=warn"
          PORT: "8080"
      Tags:
        - Key: project
          Value: !Ref Project

  # ---------- Function URL（替代 API Gateway，AWS_IAM 认证） ----------
  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: AWS_IAM
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  # 关键：Function URL 用 AWS_IAM 认证时，必须授权 CloudFront OAC 调用
  # （resource-based policy）。缺了这条 CloudFront 会返回 403。
  ApiFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ApiFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ApiDistribution}"
      FunctionUrlAuthType: AWS_IAM

  # 关键：OAC 转发还要求 lambda:InvokeFunction 权限（官方文档列出两条）。
  # 只加 InvokeFunctionUrl 时 CloudFront 会返回 403 AccessDeniedException。
  ApiFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ApiDistribution}"

  # ---------- CloudFront + OAC（只有经 CloudFront 签名的请求能到 Lambda） ----------
  ApiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Project}-${Environment}-api-oac"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${Project}-${Environment} API via CloudFront"
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: LambdaOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !Ref ApiOriginAccessControl
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: LambdaOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # API 不做边缘缓存（CachingDisabled = 4135ea2d-6df8-44a3-9df3-4b5a84be39ad；
          # 658327ea 是 CachingOptimized，会缓存 200 响应导致带认证接口返回缓存）
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # 关键：转发 viewer 的 X-Authorization 头给 origin。
          # 默认 CachePolicy 只转发基础头，自定义 header 需要 OriginRequestPolicy。
          # AllViewerExceptHostHeader = b689b0a8-53d0-40ab-baf2-68738e2966ac
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods: [GET, HEAD]

Outputs:
  FunctionUrl:
    Description: Lambda Function URL（需 SigV4 签名访问）
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  CloudFrontDomain:
    Description: CloudFront 默认域名（直接 curl 访问）
    Value: !GetAtt ApiDistribution.DomainName
  CloudFrontUrl:
    Description: CloudFront https URL
    Value: !Sub "https://${ApiDistribution.DomainName}"
  UsersTableName:
    Value: !Ref UsersTable
  JwtSeedParameter:
    Description: SSM 中 JWT 密钥参数名
    Value: !Sub "/${Project}/${Environment}/jwt_seed"
