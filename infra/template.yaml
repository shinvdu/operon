# Operon Cloud 公司网站基础设施（前后端分离）
#
# 拓扑：
#   CloudFront
#     ├─ /api/*  → Lambda Function URL（site 应用，OAC SigV4）
#     └─ 默认    → S3 静态网站（index.html / admin.html，OAC）
#
# 已验证的关键配置（勿随意改）：
#   - OAC 需两条 Lambda 权限（InvokeFunctionUrl + InvokeFunction）
#   - CachingDisabled = 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
#   - AllViewerExceptHostHeader = b689b0a8-53d0-40ab-baf2-68738e2966ac

AWSTemplateFormatVersion: "2010-09-09"
Description: Operon Cloud company website (S3 frontend + Lambda API + DynamoDB leads)

Parameters:
  Project:
    Type: String
    Default: operon
  Environment:
    Type: String
    Default: dev
  LambdaArchitecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
  LambdaMemoryMB:
    Type: Number
    Default: 256
  CodeBucket:
    Type: String
    Description: S3 bucket holding the packaged bootstrap.zip
  CodeKey:
    Type: String
    Description: S3 key of the packaged bootstrap.zip
  WebAdapterLayerArn:
    Type: String
    Description: AWS Lambda Web Adapter layer ARN
    Default: "arn:aws:lambda:us-west-2:753240598075:layer:LambdaAdapterLayerX86:28"
  DomainName:
    Type: String
    Description: 自定义域名（CloudFront Aliases）
    Default: arch.sky-city.me
  AcmCertificateArn:
    Type: String
    Description: CloudFront 用的 ACM 证书 ARN（Let's Encrypt 导入，us-east-1）
    Default: "arn:aws:acm:us-east-1:317618187345:certificate/e05c7cda-1869-4f6d-90c3-9560f017d94a"

Conditions:
  IsArm64: !Equals [!Ref LambdaArchitecture, arm64]

Resources:
  # ---------- DynamoDB：采购需求表 ----------
  LeadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Project}-${Environment}-leads"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------- S3：前端静态托管 ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Project}-${Environment}-frontend"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # 关键：S3 OAC 需要 bucket policy 授信（仅允许本 distribution 的 OAC 签名访问）
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ApiDistribution}"

  # ---------- IAM ----------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: operon-site-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt LeadsTable.Arn
                  - !Sub "${LeadsTable.Arn}/*"
              - Sid: SSMSecrets
                Effect: Allow
                Action:
                  - ssm:GetParametersByPath
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/${Environment}/*"
              - Sid: SSMDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

  # ---------- Lambda：site 应用（单函数打天下） ----------
  SiteFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-site"
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - !Ref LambdaArchitecture
      MemorySize: !Ref LambdaMemoryMB
      Timeout: 30
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Layers:
        - !Ref WebAdapterLayerArn
      Environment:
        Variables:
          OPERON_PROJECT: !Ref Project
          OPERON_ENV: !Ref Environment
          OPERON_SECRETS_PATH: !Sub "/${Project}/${Environment}/"
          OPERON_TABLE_PREFIX: !Sub "${Project}-${Environment}-"
          RUST_LOG: "info,aws_config=warn,aws_smithy=warn"
          PORT: "8080"
      Tags:
        - Key: project
          Value: !Ref Project

  # ---------- Function URL（AWS_IAM 认证） ----------
  SiteFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref SiteFunction
      AuthType: AWS_IAM
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  # OAC 需要的两条权限（缺任一都会 403）
  SiteFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref SiteFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ApiDistribution}"
      FunctionUrlAuthType: AWS_IAM
  SiteFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SiteFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ApiDistribution}"

  # ---------- CloudFront OAC（两个：S3 + Lambda） ----------
  LambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Project}-${Environment}-lambda-oac"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4
  S3OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Project}-${Environment}-s3-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- CloudFront：双 origin + 双 behavior ----------
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${Project}-${Environment} Operon Cloud website"
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: LambdaOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt SiteFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !Ref LambdaOriginAccessControl
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref S3OriginAccessControl
            S3OriginConfig: {}
        # /api/* → Lambda（前后端分离的 API 部分）
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: LambdaOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods: [GET, HEAD]
        # 默认 → S3 静态站点（index.html / admin.html）
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]

Outputs:
  CloudFrontUrl:
    Description: 网站 URL
    Value: !Sub "https://${ApiDistribution.DomainName}"
  CloudFrontDomain:
    Value: !GetAtt ApiDistribution.DomainName
  FunctionUrl:
    Description: Lambda Function URL（需 SigV4 签名）
    Value: !GetAtt SiteFunctionUrl.FunctionUrl
  LeadsTableName:
    Value: !Ref LeadsTable
  FrontendBucket:
    Value: !Ref FrontendBucket
  JwtSeedParameter:
    Value: !Sub "/${Project}/${Environment}/jwt_seed"
  AdminPasswordParameter:
    Description: SSM 中管理员密码参数名
    Value: !Sub "/${Project}/${Environment}/admin_password"
