[package]
name = "operon-s3"
version.workspace = true
edition.workspace = true

[dependencies]
operon-core = { path = "../core" }
aws-config = "1"
aws-sdk-s3 = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
